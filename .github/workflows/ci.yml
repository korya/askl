name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify committed dist/ matches the source
        run: |
          npm run build
          git diff --exit-code dist/ || {
            echo "::error::dist/ is stale — run 'npm run build' and commit the result"
            exit 1
          }
      - name: Dogfood — lint own fixtures via the action
        uses: ./
        with:
          path: test/fixtures/real/toastmasters-mini
      # `uses: ./` runs from the workspace where node_modules exists and cannot
      # catch un-bundled dependencies; this can (it is how v0.2.0 broke).
      - name: Verify dist/ runs with no node_modules in reach
        run: |
          cp dist/cli.js "$RUNNER_TEMP/"
          node "$RUNNER_TEMP/cli.js" --version
          node "$RUNNER_TEMP/cli.js" test/fixtures/plugins/valid
