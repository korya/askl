name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify committed dist/ matches the source
        run: |
          npm run build
          git diff --exit-code dist/ || {
            echo "::error::dist/ is stale — run 'npm run build' and commit the result"
            exit 1
          }
      - name: Dogfood — lint own fixtures via the action
        uses: ./
        with:
          path: test/fixtures/real/toastmasters-mini
